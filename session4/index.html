<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>fourth web page</title>
</head>

<body>
    <section class="container ">
        <div class="container-heading center">
            <h2>Facts In Numbers</h2>
            <p>Amet cras hac orci lacus. Faucibus ipsum arcu lectus nibh sapien bibendum ullamcorper in. Diam tincidunt
                tincidunt erat at semper fermentum</p>
        </div>
        <div class="cards center">
            <div class="inline-block card">
                <div class="inline-block div-icon">
                    <i class="fa-solid fa-car-rear " style="color: rgb(255, 255, 255);"></i>
                </div>
                <div class="inline-block">
                    <h3>540+</h3>
                    <p class="card-p">Cars</p>
                </div>

            </div>
            <div class="inline-block card">
                <div class="inline-block div-icon">
                    <i class="fa-solid fa-user-shield" style="color: rgb(255, 255, 255);"></i>
                </div>
                <div class="inline-block">
                    <h3>20k+</h3>
                    <p class="card-p">Customers</p>
                </div>

            </div>
            <div class="inline-block card">
                <div class="inline-block div-icon">
                    <i class="fa-solid fa-calendar-days" style="color: rgb(255, 255, 255);"></i>
                </div>
                <div class="inline-block">
                    <h3>25+</h3>
                    <p class="card-p">Years</p>
                </div>

            </div>
            <div class="inline-block card">
                <div class="inline-block div-icon">
                    <i class="fa-solid fa-gauge-high" style="color: rgb(255, 255, 255);"></i>
                </div>
                <div class="inline-block">
                    <h3>20m+</h3>
                    <p class="card-p">Miles</p>
                </div>

            </div>
        </div>
    </section>
</body>

</html>
