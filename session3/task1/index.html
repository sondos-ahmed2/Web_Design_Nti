<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first web page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: #e2ecf8 ;">
    <section class="sec">
        <div class="div1">
            <h2>Registion Form</h2>
        </div>
        <form>

            <label for="first">First Name</label>
            <input type="text" name="firstname" id="first" required>

            <label for="last">Last Name</label>
            <input type="text" name="lastname" id="last" required>

            <br>

            <label for="email">Email Address</label>
            <input type="email" name="emailadd" id="email" required>


            <label for="phone">Phone</label>
            <input type="text" name="phone" id="phone">

            <br>

            <label>City</label>
            <select name="city">
                <option value="1">london</option>
                <option value="2">paris</option>
                <option value="3">cairo</option>
            </select>

            <label>Country</label>
            <select name="country">
                <option value="1">india</option>
                <option value="2">france</option>
                <option value="3">egypt</option>
            </select>

            <div>
                <button type="submit" class="but">Get Started</button>
            </div>
        </form>
    </section>
</body>

</html>
